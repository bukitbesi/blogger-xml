name: Apply mobile performance refresh

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mobile-performance-share-og
    paths:
      - scripts/apply-mobile-performance-refresh.mjs
      - .github/workflows/apply-mobile-performance-refresh.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-performance-share-og
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration
        run: node scripts/apply-mobile-performance-refresh.mjs

      - name: Validate Blogger XML
        run: |
          npm install
          npm run validate:blogger
          npm run test:blogger

      - name: Commit generated theme
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger/production/thebukitbesi.xml
          git commit -m "optimize mobile layout share and metadata"
          git push
